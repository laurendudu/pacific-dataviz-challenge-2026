name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, mint the Pages deploy token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pacific-app-2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pacific-app-2026/package-lock.json

      - run: npm ci
      - run: npm run build

      # public/data holds one symlink per table into ../../data_viz, which is
      # ignored except for the tracked tables — so a table the app fetches but
      # nobody symlinked or un-ignored fails loudly here rather than as a 404
      # on the live site.
      - name: Check every table the app fetches made it into the bundle
        run: |
          missing=0
          for f in $(grep -rho 'data/[a-z_]*\.json' src | sort -u); do
            if [ ! -f "dist/$f" ]; then echo "missing: dist/$f"; missing=1; fi
          done
          exit $missing

      # Path is workspace-relative: `defaults.run` only applies to `run` steps.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pacific-app-2026/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
